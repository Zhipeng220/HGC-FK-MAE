work_dir: ./work_dir/egogesture/aimclr_pretext_joint

# Model
model: net.aimclr.AimCLR
model_args:
  # AimCLR Args
  base_encoder: net.ctrgcn.Model
  pretrain: True
  feature_dim: 256
  queue_size: 4096
  momentum: 0.95
  Temperature: 0.15
  mlp: True

  # Encoder (CTRGCN / HGC) Args
  in_channels: 3
  num_class: 256
  drop_out: 0.5
  num_point: 21
  num_person: 2
  adaptive: True
  graph: 'graph.egogesture.Graph'
  graph_args: {}

  # HGC-MAE Innovation 1 Arg
  num_hyperedges: 16

# Loss
loss: nt_xent_loss # (这只是一个占位符，实际损失在 processor 中计算)
loss_args:
  temperature: 0.15

# [ NEW ] HGC-MAE 损失权重
lambda_cl: 1.0
lambda_rec: 1.0
lambda_phy_max: 1.0 # (创新点 3)
lambda_align: 0.1  # (创新点 4)

# [ NEW ] HGC-MAE 掩码参数
mask_ratio: 0.7
mask_strategy: 'structured' # 'random', 'kinematic', 'structured' (创新点 5)

# [ NEW ] 梯度裁剪
grad_clip_norm: 1.0

# Optimizer
optimizer: SGD
base_lr: 0.001
optimizer_args:
  momentum: 0.9
  nesterov: True
weight_decay: 0.0001

# Learning rate scheduler
step: [100,150]
lr_decay_rate: 0.1

# Training settings
phase: train
num_epoch: 200
start_epoch: 0
save_interval: 10
eval_interval: 10
print_log: True
save_log: True
log_interval: 100
save_result: False

# Data augmentation
aug_method: aimclr
shear_amplitude: 0.3
temperal_padding_ratio: 6
stream: joint

# Random seed
seed: 1

# Feeder
feeder: feeder.feeder_egogesture.Feeder
train_feeder: feeder.feeder_egogesture.Feeder
test_feeder: feeder.feeder_egogesture.Feeder
memory_feeder: feeder.feeder_egogesture.Feeder

train_feeder_args:
  data_path: /Users/gzp/Desktop/exp/CTR-GCN-main/data/egogesture/train_data.npy
  label_path: /Users/gzp/Desktop/exp/CTR-GCN-main/data/egogesture/train_label.pkl
  split: train
  bone: False
  window_size: 50
  shear_amplitude: 0.3
  temperal_padding_ratio: 6
  random_rot: True
  random_choose: False
  random_move: False
  random_shift: False
  normalization: False
  debug: False
  use_mmap: True

test_feeder_args:
  data_path: /Users/gzp/Desktop/exp/CTR-GCN-main/data/egogesture/val_data.npy
  label_path: /Users/gzp/Desktop/exp/CTR-GCN-main/data/egogesture/val_label.pkl
  split: test
  bone: False
  window_size: 50
  normalization: False
  debug: False
  use_mmap: True

memory_feeder_args:
  data_path: /Users/gzp/Desktop/exp/CTR-GCN-main/data/egogesture/train_data.npy
  label_path: /Users/gzp/Desktop/exp/CTR-GCN-main/data/egogesture/train_label.pkl
  split: train
  bone: False
  window_size: 50
  normalization: False
  random_rot: False
  random_choose: False
  random_move: False
  random_shift: False
  debug: False
  use_mmap: True

# DataLoader settings
batch_size: 32
test_batch_size: 32
num_worker: 0

# Device
device: [0]
use_gpu: True

# KNN monitor
knn_monitor: True
knn_k: 200
knn_t: 0.1